name: agrilease
description: "AgriLease - Modern Agricultural Equipment Rental Platform for Farmers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  provider: ^6.1.2
  
  # Animation & Transitions
  animations: ^2.0.0
  lottie: ^2.4.0
  flutter_svg: ^2.0.0
  
  # UI Components
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  smooth_page_indicator: ^1.1.0
  carousel_slider: ^4.2.0
  
  # Data & Caching
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  cached_network_image: ^3.3.0
  
  # Storage
  shared_preferences: ^2.2.0
  get_storage: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
